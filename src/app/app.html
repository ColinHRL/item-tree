<div class="container">
  <h1>{{ title() }}</h1>
  <div class="button-group">
  <button (click)="generateRandomTree()">Generate Random Tree (15 nodes)</button>
  <label class="csv-label">
    <input 
      type="file" 
      accept=".csv" 
      (change)="onCSVFileSelected($event)"
      aria-label="Upload CSV file">
    Upload CSV
  </label>
</div>
  
  <div class="grid-layout">
    <div>
      <h2>Tree View</h2>
      @if (roots().length > 0) {
      <ul class="tree">@for (root of roots(); track root.itemID) {
        <app-tree-node [node]="root"></app-tree-node>
      }
      </ul>
      }
    </div>
    
    <div>
      <h2>Items Table</h2>
      <table>
        <thead>
          <tr>
            <th>itemID</th>
            <th>item</th>
            <th>subItemOfID</th>
          </tr>
        </thead>
        <tbody>
          @for (item of items(); track item.itemID) {
          <tr>
            <td>{{ item.itemID }}</td>
            <td>{{ item.item }}</td>
            <td>{{ item.subItemOfID }}</td>
          </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>

<router-outlet />
